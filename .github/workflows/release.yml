name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SWI-Prolog (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Install SWI-Prolog (macOS)
        if: runner.os == 'macOS'
        run: brew install swi-prolog

      - name: Install staticcheck
        run: |
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$GOBIN/staticcheck" -version

      - name: CI
        run: make ci

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Skip artifact attestations for private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "GitHub artifact attestations are unavailable for user-owned private repositories."
          echo "Release archives and checksums were still published."
